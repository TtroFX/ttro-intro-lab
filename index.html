<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9fc" />
  <meta name="description" content="Ttro Intro Engine - JP/EN interactive Scratch course, reference, labs, and 154-page bilingual PDF." />
  <meta property="og:title" content="Ttro Intro Engine - Interactive Course" />
  <meta property="og:description" content="Scratch intro engine: complete JP/EN course, interactive labs, reference, and 154-page bilingual PDF." />
  <title>Ttro Intro Engine - Interactive Course</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動 / Skip to content</a>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="sidebarToggle" class="icon-btn mobile-only" type="button" aria-label="目次を開く"><span aria-hidden="true">☰</span></button>
      <a class="brand" href="#/course/p01" aria-label="Ttro Intro Engine home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M5 20.5V7.5c0-1.1.9-2 2-2h14v4H10v11H5Z"/><path d="M12 22.5v-4h6.5V12H23v8.5c0 1.1-.9 2-2 2h-9Z"/></svg></span>
        <span class="brand-copy"><strong>Ttro Intro Engine</strong><small>Interactive Course</small></span>
      </a>
      <nav class="topnav" aria-label="Main navigation">
        <a href="#/course/p01" data-nav="course">Course</a>
        <a href="#/reference" data-nav="reference">Reference</a>
        <a href="#/print/1" data-nav="print">PDF</a>
        <a href="#/labs" data-nav="labs">Lab</a>
      </nav>
      <div class="top-actions">
        <button id="searchOpen" class="search-btn" type="button" title="Search (Ctrl/⌘ + K)"><span aria-hidden="true">⌕</span><span class="search-label">Search</span><kbd>⌘K</kbd></button>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="ja">JP</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="both">JP+EN</button>
        </div>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="テーマ切替" title="Theme"><span aria-hidden="true">◐</span></button>
      </div>
    </header>
    <aside id="sidebar" class="sidebar" aria-label="Course contents">
      <div class="sidebar-head"><div class="progress-copy"><span data-i18n="progress">学習進捗</span><strong id="progressPct">0%</strong></div><div class="progress-track" aria-hidden="true"><div id="progressBar"></div></div></div>
      <div id="chapterNav" class="chapter-nav"></div>
      <div class="sidebar-foot"><button id="resetProgress" class="text-btn danger" type="button">進捗をリセット</button><small>77 paired pages · JP / EN</small></div>
    </aside>
    <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>
    <main id="main" class="main" tabindex="-1"><div id="view"></div></main>
  </div>
  <dialog id="searchDialog" class="search-dialog">
    <form method="dialog" class="search-shell">
      <div class="search-input-wrap"><span aria-hidden="true">⌕</span><input id="globalSearch" type="search" autocomplete="off" placeholder="Search lessons and definitions…" aria-label="Search" /><button class="icon-btn" value="cancel" aria-label="Close">×</button></div>
      <div class="search-hint"><span>↑↓</span> move <span>Enter</span> open <span>Esc</span> close</div><div id="searchResults" class="search-results"></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="content.js"></script><script src="labs.js"></script><script src="app.js"></script>
</body>
</html>
